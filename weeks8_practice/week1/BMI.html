<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BMI</title>
		<link rel="stylesheet" href="BMIstyle.css" />
		<script src="BMI.js" defer></script>
	</head>
	<body>
		<h1>BMI</h1>
		<p class="notic">注意身高要換算成公尺</p>

		<div class="container">
			<div class="screen">
				<div class="background">
					<div class="box">
						<div class="left-box">
							<span class="text">身高:</span>
							<input type="number" id="height" placeholder="m" />
						</div>
						<div class="right-box">
							<span class="text">體重:</span>
							<input type="number" id="weight" placeholder="kg" />
						</div>
						<div class="sent-btn">
							<button type="button" id="calculate">計算</button>
						</div>
					
				</div>
			</div>
			<div class="result-box">
				<span class="text">BMI</span>
				<input type="text" id="result" disabled />
		</div>
		</div>
	</body>
</html>
